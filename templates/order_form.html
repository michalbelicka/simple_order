<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objednávkový formulár</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: #cfe8ff;">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-lg p-4" style="width: 100%; max-width: 500px; border-radius: 15px;">

        <h3 class="text-center mb-4">Objednávkový formulár</h3>

        <form action="/order" method="post">

            <div class="mb-3">
                <label class="form-label">Meno</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Adresa</label>
                <input type="text" name="address" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Produkt</label>
                <input type="text" name="product" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Množstvo</label>
                <input type="number" name="quantity" class="form-control" value="1" min="1" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Odoslať objednávku
            </button>

        </form>

    </div>

</div>

</body>
</html>
